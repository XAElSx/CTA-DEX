<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTA Dex</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1e1e">
</head>
<body>
  <header>
    <h1>CTA Dex</h1>
    <select id="game" aria-label="Game"></select>
    <details id="sync-panel">
      <summary>Sync <span id="sync-status"></span></summary>
      <div class="sync-body">
        <div class="sync-row">
          <input id="gist-token" type="password" autocomplete="off" aria-label="GitHub token">
          <button id="gist-save">Connect</button>
        </div>
        <div class="sync-row">
          <button id="sync-now">Sync now</button>
          <button id="gist-disconnect">Disconnect</button>
        </div>
        <div class="sync-row">
          <button id="export">Export file</button>
          <label class="button">Import file<input id="import" type="file" accept=".json,application/json" hidden></label>
        </div>
      </div>
    </details>
  </header>
  <div id="controls">
    <input id="search" type="search" placeholder="Search name or #" aria-label="Search">
    <select id="filter" aria-label="Filter">
      <option value="all">All</option>
      <option value="caught">Caught</option>
      <option value="missing">Missing</option>
      <option value="shiny">Shiny</option>
    </select>
    <span id="progress"></span>
  </div>
  <div id="dex"></div>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
